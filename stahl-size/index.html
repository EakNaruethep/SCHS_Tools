<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>เทียบขนาดพุกเคมีแบบปั่น Stahl SVA-VE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap">
<style>
/* หน้าเครื่องมือสำหรับฝังด้วย iframe ในบทความ schomesquare.co.th ใช้สีตาม style guide ของร้าน
   กรม #14304D = ขนาดที่เลือก / เทาจาง = ขนาดก่อนหน้า (เล็กกว่าหนึ่งขั้น) / เหลือง #FFCD01 = จุดเน้น */
:root{--bg:#ffffff;--sunk:#F6F8FA;--ink:#14304D;--text:#3A3F47;--muted:#6B7280;--line:#E3E7ED;--hi:#FFCD01;
  --cur:#14304D;--prev:#DCE2E9;--prev-ink:#8A97A8;--prev-soft:#F1F3F6;
  --concrete:#C9CDC8;--concrete-prev:#EEF0F2;--dot:#AEB4AD;--hole:#8B918B;--resin:#6F8E87;--stud:#8E989E;--edge:#4E585D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Kanit,Tahoma,sans-serif;font-size:17px;line-height:1.5}
.app{container-type:inline-size;padding:16px}
.s1{display:grid;grid-template-columns:380px minmax(0,1fr);gap:28px}
.fig{height:600px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px;touch-action:pan-y;cursor:ew-resize}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big b{font-size:54px;line-height:1;color:var(--ink);font-weight:700;border-bottom:4px solid var(--hi);padding-bottom:2px}
.big span{color:var(--muted);font-size:17px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:16px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:22px;height:12px;border-radius:3px}
.legend .c i{background:var(--cur)} .legend .p i{background:var(--prev)}
.legend .p{color:var(--prev-ink)} .legend .p i{border:1px solid #C3CBD5}
.rng{margin:14px 0 4px}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
.ticks{display:grid;font-size:15px;color:var(--muted);text-align:center;margin:0 -6px}
.ticks button{font:inherit;background:none;border:0;color:inherit;cursor:pointer;padding:4px 0;border-radius:6px}
.ticks button.on{color:#fff;background:var(--cur);font-weight:700;box-shadow:inset 0 -3px 0 var(--hi)}
.ticks button.pv{color:var(--prev-ink);background:var(--prev-soft);font-weight:400}
.rows{display:grid;gap:4px;margin-top:12px}
.r{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:12px;align-items:center;font-size:17px;min-height:56px;border-bottom:1px solid var(--line)}
.bars{display:grid;gap:3px}
.bars i{display:block;height:10px;border-radius:3px;transition:width .25s ease}
.bars .bp{background:var(--prev);height:8px} .bars .bc{background:var(--cur);height:12px}
.v{text-align:right;color:var(--ink);font-weight:700;line-height:1.25}
.v small{color:var(--muted);font-weight:400;font-size:14px}
.v .pvv{display:block;font-size:14px;font-weight:400;color:var(--prev-ink)}
.fine{font-size:15px;color:var(--muted);margin:10px 0 0}
svg{display:block;width:100%;height:100%}
.cc{fill:var(--concrete)} .ccp{fill:var(--concrete-prev)} .ccd{fill:var(--dot)} .hl{fill:var(--hole)} .rs{fill:var(--resin)}
.st{fill:var(--stud);stroke:var(--edge);stroke-width:1;vector-effect:non-scaling-stroke}
.stp{fill:var(--prev);stroke:var(--prev-ink);stroke-width:1;vector-effect:non-scaling-stroke}
.nut{fill:var(--edge)} .nutp{fill:var(--prev-ink)}
.dim{stroke:var(--ink);stroke-width:1.5;fill:none;vector-effect:non-scaling-stroke}
.dimp{stroke:var(--prev-ink);stroke-width:1.5;fill:none;vector-effect:non-scaling-stroke}
.t{font-family:Kanit,Tahoma,sans-serif;font-weight:600}
.tc{fill:var(--ink)} .tp{fill:var(--prev-ink)}
.tag{font-family:Kanit,Tahoma,sans-serif;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
@container (max-width:600px){
  .app{padding:12px 4px}
  .s1{grid-template-columns:1fr;gap:12px}
  .fig{height:270px}
  .big b{font-size:40px}
  .legend{font-size:15px;gap:14px}
  .rng{margin:8px 0 2px}
  .rows{gap:0;margin-top:6px}
  .r{grid-template-columns:minmax(0,1fr) auto;font-size:16px;min-height:40px}
  .bars{display:none}
  .v{display:flex;gap:6px;align-items:baseline;justify-content:flex-end;flex-wrap:wrap}
  .v .pvv{display:inline;order:-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ค่าติดตั้งพุกเคมีแบบปั่น Stahl SVA-VE จากแผ่นสเปก (ไม่มีค่ารับแรงตามกฎของร้าน)
const D=[
 {m:'M8', cap:'SVA-VE-8', capSz:'8 x 83', n:8, drill:10,hole:85, emb:80, stud:110,torque:10, edge:40, thk:120},
 {m:'M10',cap:'SVA-VE-10',capSz:'10 x 83',n:10,drill:12,hole:95, emb:90, stud:130,torque:20, edge:45, thk:130},
 {m:'M12',cap:'SVA-VE-12',capSz:'12 x 95',n:12,drill:14,hole:115,emb:110,stud:160,torque:40, edge:55, thk:140},
 {m:'M16',cap:'SVA-VE-16',capSz:'16 x 95',n:16,drill:18,hole:130,emb:125,stud:190,torque:80, edge:65, thk:180},
 {m:'M20',cap:'SVA-VE-20',capSz:'20 x 175',n:20,drill:24,hole:175,emb:170,stud:260,torque:120,edge:85, thk:230},
 {m:'M24',cap:'SVA-VE-24',capSz:'24 x 210',n:24,drill:28,hole:215,emb:210,stud:300,torque:180,edge:105,thk:270},
 {m:'M30',cap:'SVA-VE-30',capSz:'30 x 265',n:30,drill:35,hole:275,emb:270,stud:380,torque:300,edge:130,thk:340}];
const ROWS=[
 {k:'drill',l:'ดอกสว่าน',u:'มม.'},
 {k:'hole',l:'ความลึกรูเจาะ',u:'มม.'},
 {k:'emb',l:'ความลึกติดตั้ง',u:'มม.'},
 {k:'stud',l:'ความยาวสตัด',u:'มม.'},
 {k:'torque',l:'แรงบิดขันน็อต',u:'Nm'},
 {k:'edge',l:'ระยะขอบต่ำสุด',u:'มม.'},
 {k:'thk',l:'คอนกรีตหนาต่ำสุด',u:'มม.'}];
// เปิดมาที่ M16 (ขนาดที่คนค้นมากสุด) เปลี่ยนได้ด้วย ?size=M12 ใน URL ของ iframe
const q=new URLSearchParams(location.search);
const START=Math.max(0,D.findIndex(d=>d.m===(q.get('size')||'M16').toUpperCase()));
const MAX=Object.fromEntries(ROWS.map(r=>[r.k,Math.max(...D.map(d=>d[r.k]))]));
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

// วาดพุกหนึ่งตัวในก้อนคอนกรีตของตัวเอง (มิลลิเมตรจริง) เริ่มที่ x=ox
function anchor(d,ox,fs,prev){
  const top=-(d.stud-d.emb), sx=ox+d.edge, W=d.edge+d.drill/2+fs*4.8, ex=sx+d.drill/2+fs*.5, t=fs*.3;
  const C=prev?'p':'c';
  let s=`<rect x="${ox}" y="0" width="${W}" height="${d.thk}" class="${prev?'ccp':'cc'}"/>`;
  const st=fs*1.5;
  for(let y=st/2,r=0;y<d.thk;y+=st,r++)for(let x=ox+st/2+(r%2?st/2:0);x<ox+W;x+=st)s+=`<circle cx="${x}" cy="${y}" r="${(fs*.08).toFixed(1)}" class="ccd" opacity="${prev?.5:1}"/>`;
  s+=`<rect x="${sx-d.drill/2}" y="0" width="${d.drill}" height="${d.hole}" class="hl" opacity="${prev?.45:1}"/>`;
  s+=`<rect x="${sx-d.drill/2}" y="0" width="${d.drill}" height="${d.emb}" class="rs" opacity="${prev?.45:1}"/>`;
  s+=`<rect x="${sx-d.n/2}" y="${top}" width="${d.n}" height="${d.stud}" class="${prev?'stp':'st'}"/>`;
  s+=`<rect x="${sx-d.n}" y="-3" width="${d.n*2}" height="3" class="${prev?'nutp':'nut'}"/>`;
  s+=`<rect x="${sx-d.n*.85}" y="${-3-d.n*.8}" width="${d.n*1.7}" height="${d.n*.8}" class="${prev?'nutp':'nut'}"/>`;
  // ป้ายชื่อขนาดเหนือสตัด
  s+=`<text x="${sx}" y="${top-fs*.5}" text-anchor="middle" class="tag t${C}" font-size="${fs*1.35}">${d.m}</text>`;
  s+=`<text x="${sx}" y="${top-fs*1.85}" text-anchor="middle" class="t t${C}" font-size="${fs*.8}">${prev?'ขนาดก่อนหน้า':'ที่เลือก'}</text>`;
  // ระยะฝัง
  s+=`<path d="M${ex-t} 0h${2*t}M${ex-t} ${d.emb}h${2*t}M${ex} 0V${d.emb}" class="dim${prev?'p':''}"/>`;
  s+=`<text x="${ex+fs*.35}" y="${d.emb/2-fs*.15}" class="t t${C}" font-size="${fs*.85}">ฝัง</text>`;
  s+=`<text x="${ex+fs*.35}" y="${d.emb/2+fs*.85}" class="t t${C}" font-size="${fs}">${d.emb}</text>`;
  // ความหนาคอนกรีต
  s+=`<text x="${ox+W/2}" y="${d.thk+fs*1.25}" text-anchor="middle" class="t t${C}" font-size="${fs}">หนา ${d.thk}</text>`;
  return {s,W,top};
}
function figure(d,p){
  const H=d.thk+(d.stud-d.emb), fs=Math.max(H*0.072,11);
  let x=0;
  const parts=[];
  if(p){const a=anchor(p,x,fs,true);parts.push(a);x+=a.W+fs*1.2;}
  const b=anchor(d,x,fs,false);parts.push(b);x+=b.W;
  const minTop=Math.min(...parts.map(a=>a.top));
  const vy=minTop-fs*2.7, vh=d.thk+fs*1.7-vy;
  return `<svg viewBox="${-fs*.3} ${vy} ${x+fs*.6} ${vh}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ภาพตัดพุกเคมี ${d.m}${p?' เทียบกับ '+p.m:''}">${parts.map(a=>a.s).join('')}</svg>`;
}

const root=$('#app');
let i=START;
root.innerHTML=`<div class="s1">
  <div class="fig" aria-live="polite"></div>
  <div>
    <div class="big"><b></b><span></span></div>
    <div class="legend"></div>
    <div class="rng"><input type="range" min="0" max="${D.length-1}" step="1" aria-label="เลือกขนาดพุกเคมี"></div>
    <div class="ticks" style="grid-template-columns:repeat(${D.length},1fr)">${D.map((d,k)=>`<button data-k="${k}">${d.m}</button>`).join('')}</div>
    <div class="rows"></div>
    <p class="fine">ค่าทั้งหมดเป็นเงื่อนไขขั้นต่ำสำหรับการติดตั้ง งานโครงสร้างต้องให้วิศวกรกำหนดขนาดเสมอ</p>
  </div></div>`;
const fig=$('.fig'), rng=$('input');
function paint(){
  const d=D[i], p=i>0?D[i-1]:null;
  fig.innerHTML=figure(d,p);
  $('.big b').textContent=d.m;
  $('.big span').textContent=`Stahl ${d.cap} · หลอด ${d.capSz} มม.`;
  $('.legend').innerHTML=`<span class="c"><i></i>${d.m} ที่เลือก</span>`+(p?`<span class="p"><i></i>${p.m} ขนาดก่อนหน้า</span>`:`<span class="p">ขนาดเล็กที่สุดของรุ่นนี้</span>`);
  rng.value=i; $$('.ticks button').forEach((b,k)=>{b.classList.toggle('on',k===i);b.classList.toggle('pv',k===i-1)});
  $('.rows').innerHTML=ROWS.map(r=>{
    const dv=p?d[r.k]-p[r.k]:0;
    return `<div class="r"><span>${r.l}</span>
    <span class="bars">${p?`<i class="bp" style="width:${p[r.k]/MAX[r.k]*100}%"></i>`:''}<i class="bc" style="width:${d[r.k]/MAX[r.k]*100}%"></i></span>
    <span class="v">${d[r.k]} <small>${r.u}</small>${p?`<span class="pvv">${p.m} ${p[r.k]} ${dv?`(${dv>0?'+':'−'}${Math.abs(dv)})`:'(เท่ากัน)'}</span>`:''}</span></div>`}).join('');
}
rng.addEventListener('input',()=>{i=+rng.value;paint()});
$$('.ticks button').forEach(b=>b.onclick=()=>{i=+b.dataset.k;paint()});
let sx=null,si=0;
fig.addEventListener('pointerdown',e=>{sx=e.clientX;si=i;fig.setPointerCapture(e.pointerId)});
fig.addEventListener('pointermove',e=>{if(sx===null)return;const n=Math.max(0,Math.min(D.length-1,si+Math.round((e.clientX-sx)/36)));if(n!==i){i=n;paint()}});
fig.addEventListener('pointerup',()=>sx=null);fig.addEventListener('pointercancel',()=>sx=null);
paint();
</script>
</body>
</html>
